# Branch-only macOS arm64 build. This is NOT the release pipeline: the
# official release path verifies maintainer-signed assets staged in a draft
# release (see release-macos in ci.yml) and never builds a signed app here.
# This workflow produces an UNSIGNED arm64 .app + .dmg for testing a branch
# on Apple silicon. First launch needs right-click -> Open, because the app
# is unsigned and Gatekeeper will block a plain double-click.
name: Build macOS arm64 (unsigned)

on:
  push:
    branches: [feat/filter-degenerate-utterances]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode for Apple Speech
        shell: bash
        run: |
          # macOS 15 runners still default to Xcode 16; both runner images ship 26.3.
          developer=/Applications/Xcode_26.3.app/Contents/Developer
          test -d "$developer"
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: desktop-package
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target

      - run: npm ci --prefer-offline --no-audit --no-fund

      # The CI config disables updater artifacts, which would otherwise need
      # the updater signing key. No signing identity is configured, so the
      # bundle is unsigned.
      - name: Build unsigned arm64 app and DMG
        run: npm run tauri -- build --config src-tauri/tauri.ci.conf.json -- --locked

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimi-macos-arm64-unsigned
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
