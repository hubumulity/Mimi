name: mt-stability-research

on:
  pull_request:
    paths:
      - "scripts/research/**"
      - ".github/workflows/mt-stability-research.yml"
  push:
    branches: [main]
    paths:
      - "scripts/research/**"
      - ".github/workflows/mt-stability-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test offline candidates and probe boundaries
        run: python3 -B scripts/research/mt-research-test.py
